name: yamp
description: "Yet Another Music Player. Made to learn the Flutter Framework"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audio_metadata_reader: ^1.7.1
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  path: ^1.9.1
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  sqflite_common_ffi: any


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/albums/
    - assets/songs/
